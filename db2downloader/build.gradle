plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'jdbc_drivers/', include: ['*.jar'])
    implementation 'com.google.code.gson:gson:2+'
    implementation 'org.apache.parquet:parquet-common:1+'
    implementation 'org.apache.parquet:parquet-avro:1+'
    implementation 'org.apache.hadoop:hadoop-common:3+'
    implementation 'org.apache.hadoop:hadoop-client:3+'
    implementation 'org.apache.hadoop:hadoop-auth:3+'
    implementation 'org.apache.avro:avro:1+'

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    // implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'gov.nj.dol.DB2Downloader'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
